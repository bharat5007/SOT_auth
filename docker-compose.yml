version: '3.8'

services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - SHARED_CONTEXT_SECRET=${SHARED_CONTEXT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
    env_file:
      - .env
    restart: unless-stopped
